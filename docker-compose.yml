services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: greenledger
      POSTGRES_USER: greenledger
      POSTGRES_PASSWORD: greenledger
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenledger -d greenledger"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - greenledger-postgres:/var/lib/postgresql/data
volumes:
  greenledger-postgres:
